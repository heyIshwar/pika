services:
  - type: web
    name: pika-agents
    runtime: docker
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PIKA_ENV
        value: production
      - key: PIKA_API_KEY
        sync: false   # required in production (fail-closed auth)
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:///pika.db
