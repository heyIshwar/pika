[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pika-agents"
version = "0.1.0"
description = "Opinionated multi-agent framework built on Agno"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agno>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "sqlalchemy>=2",
    "jinja2>=3",
    "lancedb>=0.13",
]

[project.optional-dependencies]
redis = ["redis[asyncio]>=5"]
mysql = ["mysqlclient>=2"]
dspy = ["dspy-ai>=2.5"]
langfuse = ["langfuse>=3"]
otel = ["opentelemetry-sdk", "opentelemetry-exporter-otlp"]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff", "pre-commit"]

[project.scripts]
pika = "pika.cli:cli"
pikachu = "pika.cli:execute"
pika-chu = "pika.cli:chu_main"
pika-choo = "pika.cli:choo_main"

[tool.hatch.build.targets.wheel]
packages = ["pika"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "agents"]
