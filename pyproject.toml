[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pika-agents"
version = "0.3.0"
description = "Opinionated multi-agent framework built on Agno"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agno>=2.6",
    "openai>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "sqlalchemy>=2",
    "jinja2>=3",
    "lancedb>=0.13",
    "pydantic>=2",
    "httpx>=0.27",
]

[project.optional-dependencies]
redis = ["redis[asyncio]>=5"]
postgres = ["psycopg[binary]>=3.1", "pgvector>=0.3"]
dspy = ["dspy-ai>=2.5"]
embedder = ["sentence-transformers>=3"]
langfuse = [
    "langfuse>=3",
    "openinference-instrumentation-agno",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
]
otel = ["opentelemetry-sdk", "opentelemetry-exporter-otlp"]
mcp = ["fastmcp>=2"]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff", "pre-commit", "langfuse>=3", "python-dotenv"]
all = [
    "redis[asyncio]>=5",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "langfuse>=3",
    "openinference-instrumentation-agno",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "sentence-transformers>=3",
    "fastmcp>=2",
]

[project.scripts]
pika = "pika.cli.main:cli"
pikachu = "pika.cli.aliases:chu_app"
pikachoo = "pika.cli.aliases:choo_app"
pika-chu = "pika.cli.aliases:chu_app"
pika-choo = "pika.cli.aliases:choo_app"

[tool.hatch.build.targets.wheel]
packages = ["pika"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
# agents/**/tests import via `agents.<id>...`; only `pika` is pip-installed,
# so put the project root on sys.path for test collection.
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "agents"]
