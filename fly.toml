# fly deploy — from repo root
# fly secrets set OPENAI_API_KEY=sk-...

app = "pika-agents"
primary_region = "iad"

[build]
  dockerfile = "docker/Dockerfile"

[env]
  PIKA_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
